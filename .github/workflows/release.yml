# First versioned satellite release (Refs eshu-hq/eshu#9738).
#
# Tag-triggered only: pushing `vX.Y.Z` builds the release binaries, records
# the vulnerability scan, and publishes the GitHub Release with SLSA build
# provenance plus an SPDX SBOM attestation. Branch pushes never publish.
# Part of eshu-hq/eshu#6707, Refs eshu-hq/eshu#8874.
#
# Fork safety mirrors ci.yml: contents: read everywhere except the release
# job, no secrets, actions pinned by SHA (tag kept as an inline comment),
# no pull_request trigger, and timeout-minutes on every job. Releases are
# never cancelled once started.
#
# Maintainer cut (tags are maintainer-controlled; executors do not push them):
#
#   git fetch origin
#   git checkout main
#   git pull --ff-only
#   git rev-parse HEAD          # confirm the intended source commit
#   git tag v0.1.0 <sha>
#   git push origin v0.1.0
#
# The tag push starts this workflow. Verify afterwards with the commands in
# docs/release.md.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.2"
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact_name: eshu-linux-x86_64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: eshu-macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build release binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_SHA::12}"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/eshu-hq/eshu-cli/internal/buildinfo.Version=${VERSION}" \
            -o dist/${{ matrix.artifact_name }} ./cmd/eshu
          ./dist/${{ matrix.artifact_name }} version
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  vuln:
    name: vuln (govulncheck record)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: govulncheck scan (recorded on the release)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          "$(go env GOPATH)/bin/govulncheck" ./... | tee govulncheck.txt
      - name: Upload vulnerability report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: govulncheck-report
          path: govulncheck.txt

  release:
    name: Publish GitHub Release
    needs: [build, vuln]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/eshu-cli-sbom.spdx.json
          upload-artifact: false
      - name: Stage release assets and checksums
        run: |
          mkdir -p release
          cp artifacts/eshu-linux-x86_64/eshu-linux-x86_64 release/
          cp artifacts/eshu-macos-arm64/eshu-macos-arm64 release/
          cp artifacts/govulncheck-report/govulncheck.txt release/
          (cd release && sha256sum eshu-linux-x86_64 eshu-macos-arm64 govulncheck.txt eshu-cli-sbom.spdx.json > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/eshu-linux-x86_64,release/eshu-macos-arm64,release/SHA256SUMS.txt,release/eshu-cli-sbom.spdx.json
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in release/eshu-linux-x86_64 release/eshu-macos-arm64 release/SHA256SUMS.txt release/eshu-cli-sbom.spdx.json; do
            gh attestation verify "$f" -R "${GITHUB_REPOSITORY}"
          done
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release/eshu-linux-x86_64
            release/eshu-macos-arm64
            release/SHA256SUMS.txt
            release/govulncheck.txt
            release/eshu-cli-sbom.spdx.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
