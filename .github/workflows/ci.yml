# eshu-cli CI gates (epic eshu-hq/eshu-cli#1; bootstrap leaf #3).
#
# Thin caller: a `changes` job classifies paths, a `lanes` job runs the
# shared lane bodies inside the pinned eshu-hq/.github reusable, and
# `ci-complete` aggregates. `ci-complete` is the ONLY context the repo
# ruleset requires, under the exact name "ci-complete (required
# aggregator)"; renaming it makes every PR unmergeable. The lane set
# inside `lanes` is lint, test, race, shell, image, govulncheck, gosec,
# actionlint; the inner names appear as `lanes / <lane>`.
#
# Lane bodies come from
# eshu-hq/.github/.github/workflows/go-collector-ci.yml pinned to the v2
# commit SHA (the peeled tag, never the mutable tag). Each run-* input
# below is the exact expression the retired inline lane used as its `if:`.
# `changes` has no `if:` guard on purpose: every lane needs it, so skipping
# it on a schedule run would skip every lane.
#
# The separate parity.yml workflow (byte parity, census, no-fork freeze,
# tier-1 parity) is untouched by this move.
#
# Accepted deltas of the move (documented, not silent):
# - Inner lane names change: the reusable names its jobs lint, test, race,
#   shell, image, govulncheck, gosec, actionlint, shown as `lanes / <lane>`
#   instead of e.g. "lint (vet, golangci-lint, format, tidy, file cap)".
#   Only `ci-complete (required aggregator)` is ruleset-required, and it
#   keeps its name. `changes` keeps its name, "Detect changed paths".
# - The CI race lane no longer runs scripts/coverage-gate.sh. The reusable
#   computes the same total from `go tool cover -func` and fails below
#   coverage-floor, but the per-package table in the step summary becomes
#   the last 30 `go tool cover -func` lines, the floor check no longer
#   rejects a non-numeric value in shell (the input is typed as a number),
#   and the artifact is `coverage-eshu-cli` (14 days) instead of
#   `coverage-race-<sha>` with if-no-files-found: error. `make race` still
#   runs scripts/coverage-gate.sh; TestCoverageFloorParity pins Makefile
#   and this file to one floor.
# - govulncheck runs `govulncheck -scan package ./...` (the reusable's Go
#   1.26 SSA-safe mode) instead of the default symbol-level `./...`, so
#   reachability analysis of called symbols is no longer applied. The
#   scheduled tracking issue is no longer opened or updated (no reusable
#   hook yet; a red scheduled run replaces it) and the `issues: write`
#   grant goes with it.
# - gosec stays advisory (gosec-fail-on-findings is not set). The SARIF no
#   longer uploads to the Security tab (the reusable keeps a read-only
#   token for fork safety); findings ride the 14-day `gosec-eshu-cli`
#   artifact, and the `security-events: write` grant goes with it.
# - The `go.mod` presence probe is gone: go.mod has landed, so the lanes
#   never go dormant.
# - The 500-line cap scans every .go file under the tree via find instead
#   of `git ls-files '*.go'`; the tidy check is `go mod tidy -diff` plus
#   git diff on go.mod and go.sum. setup-go reads go.mod (go 1.26.10)
#   instead of a GO_VERSION env, with its module cache on.
# - shellcheck runs from the reusable's ludeeus/action-shellcheck pin
#   (2.0.0) at the action's default severity, instead of
#   `shellcheck --severity=warning` over `git ls-files '*.sh'`. All five
#   scripts pass at default severity.
# - The image lane is a bare `docker build` of ./Dockerfile tagged
#   eshu-cli:ci with no --build-arg, so the Dockerfile ARG GO_VERSION
#   default applies (TestImageToolchainMatchesGoMod pins it to go.mod).
#   The two smoke runs (--help, version) ride the image-command input.
# - actionlint runs from the sha256-checked 1.7.12 tarball instead of
#   `go install ...@v1.7.7`, so it is a newer pin and findings of 1.7.12
#   apply.
# - Tool pins that are inputs here: golangci-lint v2.12.2, govulncheck
#   v1.9.0, gosec v2.30.0 (newer than the reusable default v2.27.1, held
#   at the retired pin), actionlint 1.7.12 (sha256 8aca8db9...a3d8).
#
# The coverage ratchet is live: coverage-floor sits just under the measured
# total, is pinned equal to the Makefile by ci_workflow_test.go, and may
# only rise. The reusable pin moves by a reviewed commit, with the contract
# test updated alongside it.
#
# Pinned actions (SHAs synced with the uses: lines below; re-verify with
# git ls-remote when auditing):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4.0.3            ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   eshu-hq/.github go-collector-ci v2   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Every other action runs inside the reusable at that same pin.

name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      deps: ${{ steps.filter.outputs.deps }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      gate: ${{ steps.filter.outputs.gate }}
      shell: ${{ steps.filter.outputs.shell }}
      image: ${{ steps.filter.outputs.image }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '*.example.*'
            # Gate inputs: the race lane enforces the coverage floor, so
            # any edit to the gate script or the Makefile floor/profile
            # wiring must select the race lane (eshu-hq/eshu-cli#35
            # review P1).
            gate:
              - 'scripts/coverage-gate.sh'
              - 'Makefile'
            shell:
              - '**/*.sh'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflow:
              - '.github/workflows/**'

  lanes:
    name: lanes
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: eshu-cli
      go-version-file: go.mod
      # Coverage floor history (eshu-hq/eshu-cli#6): first baseline 43.8%,
      # raised per increment; increment 13 (cmd/eshu command handlers) took
      # the total to 90.4%, floor 90.2. Raise only; never lower. Pinned
      # equal to the Makefile by TestCoverageFloorParity.
      coverage-floor: 90.2
      # Pin every tool the retired lanes pinned; the reusable defaults float
      # across tags and this move must neither downgrade nor silently
      # upgrade a scanner.
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-test: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-race: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.gate == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-shell: ${{ needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-image: ${{ needs.changes.outputs.image == 'true' || needs.changes.outputs.workflow == 'true' }}
      image-tag: eshu-cli:ci
      image-context: .
      # Build, then smoke-test the binary in the built image (the retired
      # image lane ran the same two commands).
      image-command: |
        docker run --rm eshu-cli:ci --help
        docker run --rm eshu-cli:ci version
      # No boundary gate in this repo: the lane stays off.
      run-boundary: false
      run-govulncheck: ${{ needs.changes.outputs.deps == 'true' || github.event_name == 'schedule' }}
      run-gosec: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || github.event_name == 'schedule' }}
      run-actionlint: ${{ needs.changes.outputs.workflow == 'true' }}

  ci-complete:
    name: ci-complete (required aggregator)
    needs: [changes, lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate lane results
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job objects never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Never change this shape without a seeded red proof.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
