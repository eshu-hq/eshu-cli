# Bootstrap CI: path-aware lanes with a ci-complete aggregator.
#
# Part of eshu-hq/eshu-cli#1 (epic). Bootstrap leaf: eshu-hq/eshu-cli#3.
# Lane bodies stay dormant until their inputs land (no go.mod yet):
# Go lanes skip with success when go.mod is absent, so docs-only PRs
# run no lane and ci-complete still reports success.
#
# Fork safety: contents: read everywhere, no secrets, actions pinned by
# SHA (tag kept as an inline comment), per-PR concurrency cancellation,
# and timeout-minutes on every job.

name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.2"
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.9.0
  GOSEC_VERSION: v2.30.0

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      deps: ${{ steps.filter.outputs.deps }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      image: ${{ steps.filter.outputs.image }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '*.example.*'
            shell:
              - '**/*.sh'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflow:
              - '.github/workflows/**'

  lint:
    name: lint (vet, golangci-lint, format, tidy, file cap)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...
      - name: Install golangci-lint
        if: hashFiles('go.mod') != ''
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: golangci-lint run
        if: hashFiles('go.mod') != ''
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Format check (gofumpt via golangci-lint fmt)
        if: hashFiles('go.mod') != ''
        run: |
          "$(go env GOPATH)/bin/golangci-lint" fmt --diff ./...
      - name: go mod tidy drift check
        if: hashFiles('go.mod') != ''
        run: |
          cp go.mod /tmp/ci-go.mod.orig
          cp go.sum /tmp/ci-go.sum.orig
          go mod tidy
          diff /tmp/ci-go.mod.orig go.mod
          diff /tmp/ci-go.sum.orig go.sum
      - name: 500-line file cap (plain wc, no plugin)
        run: |
          fail=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f" | tr -d ' ')
            if [ "$lines" -gt 500 ]; then
              echo "OVER CAP: $f has $lines lines (max 500)"
              fail=1
            fi
          done < <(git ls-files '*.go')
          exit "$fail"

  test:
    name: test (build + go test)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go build and go test
        if: hashFiles('go.mod') != ''
        run: |
          go build ./...
          go test ./... -count=1
      - name: No Go module yet, nothing to build or test
        if: hashFiles('go.mod') == ''
        run: |
          echo "No go.mod: lane skips with success until Go code lands."

  race:
    name: race (go test -race)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go test -race
        if: hashFiles('go.mod') != ''
        run: go test ./... -race -count=1
      - name: No Go module yet, race skips
        if: hashFiles('go.mod') == ''
        run: |
          echo "No go.mod: race lane skips with success until Go code lands (issue #5 wires the coverage gate)."

  shell:
    name: shell (shellcheck)
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: shellcheck over changed shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          git ls-files '*.sh' | xargs --no-run-if-empty shellcheck --severity=warning

  workflow-lint:
    name: workflow-lint (actionlint)
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          BINARY="$(go env GOPATH)/bin/actionlint"
          "$BINARY"

  govulncheck:
    name: govulncheck (vulnerability scan)
    needs: changes
    if: needs.changes.outputs.deps == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install govulncheck
        if: hashFiles('go.mod') != ''
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck scan
        if: hashFiles('go.mod') != ''
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: No Go module yet, scan skips
        if: hashFiles('go.mod') == ''
        run: |
          echo "No go.mod: govulncheck skips with success until Go code lands."
      - name: Open or update a tracking issue on findings
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="govulncheck findings on ${{ github.ref_name }}"
          body="govulncheck failed on run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Triage findings in the open; no blanket exclusions."
          existing=$(gh issue list --search "$title" --state open --json number --jq -r '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body" --label enhancement
          else
            gh issue comment "$existing" --body "$body"
          fi

  gosec:
    name: gosec (SARIF, advisory)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install gosec
        if: hashFiles('go.mod') != ''
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      - name: gosec scan to SARIF (advisory until the false-positive rate is measured)
        if: hashFiles('go.mod') != ''
        continue-on-error: true
        run: |
          "$(go env GOPATH)/bin/gosec" -fmt sarif -out gosec.sarif ./...
      - name: No Go module yet, scan skips
        if: hashFiles('go.mod') == ''
        run: |
          echo "No go.mod: gosec skips with success until Go code lands."
      - name: Upload gosec SARIF
        if: hashFiles('go.mod') != '' && hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: gosec.sarif
          category: gosec

  ci-complete:
    name: ci-complete (required aggregator)
    needs: [changes, lint, test, race, shell, workflow-lint, govulncheck, gosec]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate lane results
        run: |
          fail=0
          for lane in changes lint test race shell workflow-lint govulncheck gosec; do
            case "$lane" in
              changes) result="${{ needs.changes.result }}" ;;
              lint) result="${{ needs.lint.result }}" ;;
              test) result="${{ needs.test.result }}" ;;
              race) result="${{ needs.race.result }}" ;;
              shell) result="${{ needs.shell.result }}" ;;
              workflow-lint) result="${{ needs.workflow-lint.result }}" ;;
              govulncheck) result="${{ needs.govulncheck.result }}" ;;
              gosec) result="${{ needs.gosec.result }}" ;;
            esac
            echo "$lane: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "ci-complete: a needed lane failed."
            exit 1
          fi
          echo "ci-complete: all needed lanes passed (skipped lanes were not needed)."
