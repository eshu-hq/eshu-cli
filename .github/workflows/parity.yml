name: parity

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify verbatim contract byte-parity
        run: bash scripts/check-parity.sh
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Census (closures, pins, credentials)
        if: hashFiles('go.mod') != ''
        run: bash scripts/check-census.sh
      - name: No-fork freeze against the pinned core commit
        if: hashFiles('go.mod') != ''
        run: bash scripts/check-nofork.sh --fetch --require-fetch
      - name: Tier-1 parity (help, envelopes, exits 0-6)
        if: hashFiles('go.mod') != ''
        run: bash scripts/check-tier1-parity.sh check
