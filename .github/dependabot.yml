# Dependabot for eshu-cli: Go modules and GitHub Actions.
#
# Part of eshu-hq/eshu-cli#1 (epic). Weekly grouped updates so a single
# PR carries each ecosystem's bumps. The gomod entry stays quiet until
# the first go.mod lands.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-updates:
        patterns:
          - "*"
